[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
minisign = "0.7"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
minisign-verify = "0.2"
