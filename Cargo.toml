[package]
name = "rona"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = ["self-update"]
# Off for builds that a package manager updates.
self-update = []

[dependencies]
arboard = { version = "3.7", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Extism's own HTTP is left out, plugins only reach the network through src/plugins/net.rs.
extism = { version = "1.41.0", default-features = false, features = ["wasmtime-default-features"] }
glow = "0.18"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
libloading = "0.9.1"
lofty = "0.25"
minisign-verify = "0.2"
rfd = "0.18"
# The package and manifest rules, shared with the packer so the two can't disagree.
rona-plugin = { path = "plugin-sdk/rust", default-features = false }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.2"
slint = { version = "~1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-winit-030"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dev-dependencies]
minisign = "0.7"
rona-plugin = { path = "plugin-sdk/rust" }

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
resvg = { version = "0.50", default-features = false }
slint-build = "~1.19"
winresource = "0.1.34"
